<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPulse Task 5</title>
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .section {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    textarea,
    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
    }

    button {
      cursor: pointer;
    }

    #status {
      font-weight: bold;
    }

    #messages {
      min-height: 200px;
    }

    .event-chat {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .event-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .message {
      background: #f1f1f1;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }

    .message strong {
      display: inline-block;
      margin-bottom: 5px;
    }

    #logs {
      background: #111;
      color: white;
      padding: 15px;
      min-height: 150px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>EventPulse Task 5</h1>

  <div class="section">
    <h2>Connection</h2>

    <label>JWT Token</label>

    <textarea
      id="token"
      rows="6"
      placeholder="Paste JWT token"
    ></textarea>

    <button id="connectButton">
      Connect
    </button>

    <p>
      Status:
      <span id="status">Disconnected</span>
    </p>
  </div>

  <div class="section">
    <h2>Admin Announcement</h2>

    <label>Event ID</label>

    <input
      id="eventId"
      type="text"
      placeholder="Enter event ID"
    >

    <label>Announcement</label>

    <textarea
      id="announcement"
      rows="4"
      placeholder="Write announcement"
    ></textarea>

    <button id="sendButton">
      Send Announcement
    </button>
  </div>

  <div class="section">
    <h2>Event Chats</h2>

    <div id="messages"></div>
  </div>

  <div class="section">
    <h2>Logs</h2>

    <pre id="logs"></pre>
  </div>

  <script>
    let socket = null;

    const tokenInput = document.getElementById("token");
    const connectButton = document.getElementById("connectButton");
    const status = document.getElementById("status");
    const eventIdInput = document.getElementById("eventId");
    const announcementInput = document.getElementById("announcement");
    const sendButton = document.getElementById("sendButton");
    const messagesContainer = document.getElementById("messages");
    const logsContainer = document.getElementById("logs");

    const eventChats = {};

    function log(message) {
      logsContainer.textContent += message + "\n";
      console.log(message);
    }

    function createEventChat(eventId, eventTitle) {
      if (eventChats[eventId]) {
        return eventChats[eventId];
      }

      const chat = document.createElement("div");

      chat.className = "event-chat";

      chat.innerHTML = `
        <div class="event-title">
          ${eventTitle}
        </div>
        <div class="event-messages"></div>
      `;

      messagesContainer.appendChild(chat);

      eventChats[eventId] = chat;

      return chat;
    }

    function addMessage(eventId, eventTitle, data) {
      const chat = createEventChat(
        eventId,
        eventTitle
      );

      const messages = chat.querySelector(
        ".event-messages"
      );

      const message = document.createElement("div");

      message.className = "message";

      message.innerHTML = `
        <strong>${data.sender.name}</strong><br>
        ${data.message}<br>
        <small>
          ${new Date(data.createdAt).toLocaleString()}
        </small>
      `;

      messages.appendChild(message);
    }

    connectButton.addEventListener("click", () => {
      const token = tokenInput.value.trim();

      if (!token) {
        alert("Enter a JWT token");
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      messagesContainer.innerHTML = "";

      Object.keys(eventChats).forEach((key) => {
        delete eventChats[key];
      });

      log("Connecting...");

      socket = io("http://localhost:3000", {
        auth: {
          token
        }
      });

      socket.on("connect", () => {
        status.textContent = "Connected";

        log(`Connected: ${socket.id}`);
      });

      socket.on("connect_error", (error) => {
        status.textContent = "Connection error";

        log(`Connection error: ${error.message}`);
      });

      socket.on("disconnect", (reason) => {
        status.textContent = "Disconnected";

        log(`Disconnected: ${reason}`);
      });

      socket.on("messageHistory", (data) => {
        const eventId = data.event._id;
        const eventTitle = data.event.title;

        log(
          `History received for ${eventTitle}: ${data.messages.length} message(s)`
        );

        data.messages.forEach((message) => {
          addMessage(
            eventId,
            eventTitle,
            {
              sender: message.sender,
              message: message.message,
              createdAt: message.createdAt
            }
          );
        });
      });

      socket.on("announcement", (data) => {
        const eventId = data.event._id;
        const eventTitle = data.event.title;

        log(
          `New announcement received for ${eventTitle}`
        );

        addMessage(
          eventId,
          eventTitle,
          data
        );
      });

      socket.on("announcementSent", (data) => {
        log("Announcement sent successfully");
      });

      socket.on("announcementError", (data) => {
        log(
          `Announcement error: ${data.message}`
        );

        alert(data.message);
      });
    });

    sendButton.addEventListener("click", () => {
      if (!socket || !socket.connected) {
        alert("Connect first");
        return;
      }

      const eventId = eventIdInput.value.trim();
      const message = announcementInput.value.trim();

      if (!eventId) {
        alert("Enter the event ID");
        return;
      }

      if (!message) {
        alert("Enter an announcement");
        return;
      }

      socket.emit(
        "broadcastAnnouncement",
        {
          eventId,
          message
        }
      );

      announcementInput.value = "";
    });
  </script>

</body>
</html>
